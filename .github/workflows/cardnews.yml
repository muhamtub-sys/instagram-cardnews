# 하루 2번 인스타그램에 올립니다. 아침 07:00 = 릴스만(훅 + 핵심 3가지), 저녁 18:40 = 아침과 다른 이슈로 카드뉴스만.
# 같은 내용이 피드에 두 번 보이지 않게 회차마다 한 가지만 올림. (PC 필요 없음, 공개 저장소면 무료)
name: Instagram card news

on:
  schedule:
    # GitHub 예약은 아침에 40분 넘게 늦게 시작되는 일이 잦아서,
    # 아침 회차는 06:00 에 미리 시작해 릴스를 만들어 두고 07:00 까지 기다렸다 올림
    - cron: "0 21 * * *"     # 한국시간 06:00 시작 → 07:00 릴스 게시
    - cron: "40 9 * * *"     # 한국시간 18:40 카드뉴스 게시
  workflow_dispatch:          # Actions 탭 → Run workflow 로 바로 실행
    inputs:
      mode:
        description: "올릴 종류 (auto = 15시 전이면 릴스, 이후면 카드뉴스, post = 새로 만들지 않고 posts.csv 의 대기분만 올리기)"
        type: choice
        options: [auto, reel, cards, post]
        default: auto

permissions:
  contents: write             # 만든 카드 이미지와 posts.csv 를 저장소에 커밋

concurrency:
  group: instagram-cardnews
  cancel-in-progress: false

jobs:
  cardnews:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}   # 시스템 사용자 토큰(EA…) 기준. 인스타 로그인 토큰(IGA…)이면 graph.instagram.com
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Settings → Secrets and variables → Actions → Variables 에서 바꿀 수 있음
      BRAND: ${{ vars.BRAND || '이슈 한 장' }}
      HANDLE: ${{ vars.HANDLE || '@issue_onecard' }}
      MODE: ${{ github.event.schedule == '0 21 * * *' && 'reel' || github.event.schedule == '40 9 * * *' && 'cards' || inputs.mode || 'auto' }}
      ISSUE_COUNT: ${{ vars.ISSUE_COUNT || '5' }}            # 저녁 카드뉴스 이슈 수
      REEL_ISSUE_COUNT: ${{ vars.REEL_ISSUE_COUNT || '3' }}  # 아침 릴스 이슈 수
      REELS: ${{ vars.REELS || 'on' }}            # off 로 두면 아침에도 카드뉴스
      REEL_STYLE: ${{ vars.REEL_STYLE || 'story' }}  # story=주제 영상(스톡 영상 키 필요, 없으면 릴스 건너뜀), cards=카드 슬라이드
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      REEL_TTS: ${{ vars.REEL_TTS || 'on' }}      # off 로 두면 AI 음성 없이 배경음만
      REEL_VOICE: ${{ vars.REEL_VOICE || 'ko-KR-SunHiNeural' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: ffmpeg 준비
        if: env.MODE != 'post'
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: 이슈 모아 릴스 또는 카드뉴스 만들기
        if: env.MODE != 'post'
        run: python cardnews.py

      # 이미지를 먼저 올려야 인스타가 가져갈 공개 주소가 생김
      - name: 카드 이미지 저장
        if: env.MODE != 'post'
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add -A images topics posts.csv
          git diff --cached --quiet && { echo "새로 만든 게시물 없음"; exit 0; }
          git commit -m "게시물 생성 $(TZ=Asia/Seoul date '+%m/%d %H:%M') ($MODE)"
          git push

      # 영상은 저장소가 계속 커지지 않도록 reels 브랜치에 최신 것만 덮어씀
      - name: 릴스 영상 저장
        if: env.MODE != 'post' && hashFiles('reels_out/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/reels && cp reels_out/*.mp4 reels_out/*.jpg /tmp/reels/
          cd /tmp/reels
          git init -q -b reels
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add . && git commit -qm "릴스 $(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" reels

      - name: 공개 주소 반영 대기
        run: sleep 20

      # 아침 예약 회차만: 한국시간 07:00 전이면 그때까지 기다림 (이미 지났으면 바로 올림)
      - name: 아침 회차는 07:00 까지 대기
        if: github.event_name == 'schedule' && github.event.schedule == '0 21 * * *'
        run: |
          target=$(TZ=Asia/Seoul date -d '07:00' +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "한국시간 07:00 까지 $(( (target - now) / 60 ))분 대기"
            sleep $(( target - now ))
          else
            echo "이미 07:00 이 지나 바로 올림"
          fi

      - name: 인스타 계정 ID 찾기 (IG_USER_ID 비어 있을 때만, 로그에서 숫자 확인)
        if: env.IG_ACCESS_TOKEN != '' && env.IG_USER_ID == ''
        run: python autopost.py --check

      - name: 인스타그램에 올리기
        if: env.IG_ACCESS_TOKEN != '' && env.IG_USER_ID != ''
        run: python autopost.py

      - name: 게시 결과 저장
        if: always()
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add posts.csv
          git diff --cached --quiet && exit 0
          git commit -m "게시 결과 기록"
          git push || (git pull --rebase -q && git push)
